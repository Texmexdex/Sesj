<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2d5a27">
<title>SESJ Field Quote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column job ticket. Tabs on top, work cards in the middle, running total pinned to the bottom. */
:root {
  --bg: #eef0ec;
  --surface: #ffffff;
  --ink: #141614;
  --muted: #5d645c;
  --line: #d3d8d0;
  --accent: #2d5a27;
  --accent-ink: #ffffff;
  --accent-soft: #e3ecdf;
  --warn: #9a5a00;
  --warn-soft: #fbf0dc;
  --bad: #a3271c;
  --bad-soft: #f8e3e0;
  --good: #2d5a27;
  --chip: #f4f6f2;
  --display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111311; --surface: #1b1e1b; --ink: #eef1ec; --muted: #a2aa9f; --line: #333833;
    --accent: #7fb874; --accent-ink: #0d140c; --accent-soft: #233221;
    --warn: #e8b25a; --warn-soft: #2f2615; --bad: #f08a7e; --bad-soft: #351b18;
    --good: #7fb874; --chip: #232723; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111311; --surface: #1b1e1b; --ink: #eef1ec; --muted: #a2aa9f; --line: #333833;
  --accent: #7fb874; --accent-ink: #0d140c; --accent-soft: #233221;
  --warn: #e8b25a; --warn-soft: #2f2615; --bad: #f08a7e; --bad-soft: #351b18;
  --good: #7fb874; --chip: #232723; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
#print { display: none; }
#print .ph { display: flex; gap: 14px; align-items: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 14px; }
#print .ph img { width: 72px; height: 72px; }
#print h1 { font-family: var(--display); font-weight: 850; font-stretch: 80%; text-transform: uppercase; margin: 0; font-size: 20pt; }
#print .doc { margin-left: auto; text-align: right; }
#print .doc .t { font-family: var(--display); font-weight: 850; font-size: 22pt; letter-spacing: .08em; text-transform: uppercase; }
#print .bill { margin: 6px 0 4px; line-height: 1.45; }
#print table { width: 100%; border-collapse: collapse; margin-top: 12px; }
#print th, #print td { padding: 7px 4px; border-bottom: 1px solid #ccc; text-align: left; vertical-align: top; }
#print .r { text-align: right; white-space: nowrap; }
#print tr.tot td { border-top: 2px solid #000; border-bottom: 0; font-weight: 700; font-size: 14pt; }
#print .foot { margin-top: 18px; font-size: 10pt; color: #333; }
@media print {
  body { background: #fff !important; color: #000 !important; padding: 0 !important; }
  .wrap, .bar, .toast { display: none !important; }
  #print { display: block; color: #000; font-family: var(--body); font-size: 11.5pt; }
  @page { margin: 0.5in; }
}
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 140px;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header.top { display: flex; align-items: center; gap: 12px; }
header.top img { width: 52px; height: 52px; border-radius: 10px; background: #fff; padding: 3px; flex-shrink: 0; }
header.top h1 { font-family: var(--display); font-stretch: 80%; font-weight: 850; font-size: 21px; line-height: 1.05; margin: 0; letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; }
header.top .sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.mode { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
.dot.on { background: var(--good); }

nav.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
nav.tabs button { font-family: var(--display); font-weight: 700; font-stretch: 85%; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; border: 0; border-radius: 9px; padding: 11px 6px; background: transparent; color: var(--muted); cursor: pointer; }
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h2 { font-family: var(--display); font-stretch: 85%; font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; margin: 0; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card h2 .num { font-family: var(--mono); color: var(--ink); letter-spacing: 0; text-transform: none; font-size: 13px; }

label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 500; min-width: 0; }
input, textarea, select { font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 11px 12px; width: 100%; min-width: 0; }
input:focus-visible, textarea:focus-visible, button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
textarea { resize: vertical; min-height: 64px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .grid2.stack { grid-template-columns: 1fr; } }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > .lbl { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 14.5px; font-weight: 500; border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; padding: 9px 13px; cursor: pointer; min-height: 40px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip.kind { font-family: var(--display); font-stretch: 85%; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; font-size: 14px; }

.item { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 12px; background: var(--surface); }
.item-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.item-head .t { font-family: var(--display); font-stretch: 85%; font-weight: 800; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-top: 4px; }
.x { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.price-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-top: 1px dashed var(--line); padding-top: 10px; }
.price-row .p { font-family: var(--mono); font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums; }
.price-row .why { font-size: 12.5px; color: var(--muted); }
.desc-preview { font-size: 13.5px; color: var(--muted); background: var(--bg); border-radius: 9px; padding: 9px 11px; }

.note { font-size: 13.5px; border-radius: 10px; padding: 10px 12px; line-height: 1.4; }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.bad { background: var(--bad-soft); color: var(--bad); }
.note.ok { background: var(--accent-soft); color: var(--accent); }
.note b { font-weight: 600; }

.btn { font-family: var(--display); font-stretch: 85%; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; font-size: 15px; border-radius: 11px; padding: 13px 16px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.dashed { background: transparent; color: var(--muted); border: 2px dashed var(--line); width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }

table.sum { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.sum td { padding: 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.sum td:last-child { text-align: right; font-family: var(--mono); white-space: nowrap; padding-left: 12px; }
table.sum tr.minus td:last-child { color: var(--good); }
table.sum tr.total td { border-bottom: 0; border-top: 2px solid var(--ink); font-family: var(--display); font-stretch: 85%; font-weight: 850; font-size: 20px; padding-top: 10px; text-transform: uppercase; }
table.sum tr.total td:last-child { font-family: var(--mono); font-size: 20px; }
.check { display: flex; gap: 10px; align-items: center; font-size: 15px; cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex-shrink: 0; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.bar .in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.bar .tot { flex: 1; min-width: 0; }
.bar .tot .k { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.bar .tot .v { font-family: var(--mono); font-weight: 600; font-size: 24px; font-variant-numeric: tabular-nums; }
.bar .btn { flex: 0 0 auto; }

.log-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 460px) { .log-stats { grid-template-columns: repeat(2, 1fr); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.stat .k { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.stat .v { font-family: var(--mono); font-weight: 600; font-size: 19px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.qrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; text-align: left; width: 100%; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; }
.qrow .who { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.qrow .amt { font-family: var(--mono); font-weight: 600; text-align: right; }
.qrow .meta { font-size: 12.5px; color: var(--muted); min-width: 0; }
.pill { display: inline-block; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); border: 1px solid var(--line); }
.pill.won { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.done { background: var(--ink); color: var(--bg); border-color: transparent; }
.pill.lost { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.empty { text-align: center; color: var(--muted); font-size: 14.5px; padding: 26px 12px; }
.small { font-size: 12.5px; color: var(--muted); }
a { color: var(--accent); }
.copybox { font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; min-height: 200px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .18s ease-out; } @keyframes rise { from { transform: translate(-50%, 8px); opacity: 0; } } }
</style>
</head>

    const b = find(DBH, it.dbh), h = find(HEIGHT, it.height), me = find(METHOD, it.method), co = find(CONDITION, it.condition), ac = find(ACCESS, it.access), cn = find(CANOPY, it.canopy || "normal");
    out.loads = it.haul ? r2(b.loads * cn.lf) : 0;
    out.ph = b.hrs * h.f * me.f * co.f * ac.f * cn.f * lineF * spx.work + out.loads * HAUL_HRS * crew;
    out.pass = out.loads * c.dumpFee + (it.method === "crane" ? c.craneFee : 0) + spx.wear * c.wearFee;
    out.price = r5(out.pass + out.ph * T / keep);
    out.pub = b.pub;
    out.desc = ["Tree removal: " + sp + ", " + b.label + " trunk, " + h.label.toLowerCase(), cn.d, me.d, lineD, co.d, ac.d,
                it.haul ? "Wood and brush hauled off, site raked clean" : "Wood left on site, cut to manageable lengths"].filter(Boolean).join(". ") + ".";
    if (out.price < b.pub) out.warn = "This is under the cheapest public highway-contract bid for this size (" + money0(b.pub) + "). Check the inputs.";
  } else if (it.kind === "trim") {
    const h = find(HEIGHT, it.height), t = find(TRIM, it.trimType), ac = find(ACCESS, it.access), cn = find(CANOPY, it.canopy || "normal");
    out.loads = it.haul ? r2(h.trimLoads * cn.lf) : 0;
    out.ph = h.trimHrs * t.f * ac.f * cn.f * lineF * spx.trim + out.loads * HAUL_HRS * crew;
    out.pass = out.loads * c.dumpFee + spx.wear * c.wearFee;
    out.price = r5(out.pass + out.ph * T / keep);
    out.desc = [t.label + ": " + sp + ", " + h.label.toLowerCase(), t.d, spx.care, lineD, ac.d, it.haul ? "Brush hauled off" : "Brush left stacked on site"].filter(Boolean).join(". ") + ".";
  } else if (it.kind === "stump") {
    const inch = Math.max(0, num(it.stumpIn));
    out.price = r5(Math.max(c.stumpMin, inch * c.stumpPerInch));
    out.ph = out.price * keep / T;
    out.desc = "Stump grinding: " + inch + "\" diameter, ground below grade.";
  } else if (it.kind === "hourly") {
    const hrs = Math.max(0, num(it.hours)), loads = Math.max(0, num(it.loads));
    out.loads = loads;
    out.ph = (hrs + loads * HAUL_HRS) * crew;
    out.pass = loads * c.dumpFee;
    out.price = r5(out.pass + out.ph * T / keep);
    out.desc = "Storm / cleanup labor: " + hrs + " hours on site, crew of " + crew + (loads ? ", " + loads + " load" + (loads === 1 ? "" : "s") + " hauled" : "") + ".";
  } else {
    out.manual = true;
    out.price = Math.max(0, num(it.price));
    out.ph = out.price * keep / T;
    out.desc = (it.desc || "").trim() || "Custom item";

}
function priceQuote(q, c) {
  const crew = Math.max(1, parseInt(q.crew, 10) || 2);
  const b = Math.min(Math.max(c.bizShare, 0), 90) / 100, keep = 1 - b;
  const lines = q.items.map((it) => ({ it, r: priceItem(it, c, crew) }));
  const priced = lines.filter((l) => !l.r.blocked);
  const itemsTotal = priced.reduce((s, l) => s + l.r.price, 0);
  const pass = r2(priced.reduce((s, l) => s + l.r.pass, 0));
  const ph = priced.reduce((s, l) => s + l.r.ph, 0);
  const days = Math.max(1, Math.ceil(ph / crew / 8 - 1e-9));
  const floorSplit = crew === 1 ? c.soloMin * days : r2(c.dayMin * crew * days / keep);
  let split = r2(itemsTotal - pass);
  const minAdj = priced.length && split < floorSplit ? r2(floorSplit - split) : 0;
  split = r2(split + minAdj);
  const sub = r2(itemsTotal + minAdj);
  const chosen = DISCOUNTS.filter((d) => q.discounts.includes(d.k));
  const wantPct = chosen.reduce((s, d) => s + d.pct, 0);
  const pct = Math.min(wantPct, c.discountCap);
  let disc = r2(split * pct / 100);
  const fromBiz = !!+c.discountFrom && crew > 1;
  let limited = pct < wantPct ? "Discounts add up to " + wantPct + "%, capped at " + c.discountCap + "%." : "";
  if (!q.override && disc > 0) {
    if (fromBiz) {
      const maxDisc = r2(split * b);
      if (disc > maxDisc) { disc = maxDisc; limited = "Discount trimmed to " + money(disc) + ", all the business share can cover."; }
    } else if (split - disc < floorSplit) {
      disc = Math.max(0, r2(split - floorSplit));
      limited = "Discount trimmed to " + money(disc) + " so " + (crew === 1 ? "the job stays at your " + money0(c.soloMin) + " minimum" : "everyone still makes the " + money0(c.dayMin) + " day minimum" + (days > 1 ? " for all " + days + " days" : "")) + ". Need more off? Ask Drew.";
    }
  }
  const standardPre = r2(sub - disc);
  const standardTotal = r2(standardPre + (q.taxOn ? r2(standardPre * c.taxRate / 100) : 0));
  const agreedIn = num(q.agreed, 0);
  const agreed = agreedIn > 0 && priced.length > 0;
  const pre = agreed ? r2(q.taxOn ? agreedIn / (1 + c.taxRate / 100) : agreedIn) : standardPre;
  const negAdj = agreed ? r2(pre - standardPre) : 0;
  const splitNet = r2(pre - pass);
  let bizAmt, each;
  if (fromBiz) { const pool = r2(split * keep); each = r2(pool / crew); bizAmt = r2(splitNet - pool); }
  else { bizAmt = r2(splitNet * b); each = r2((splitNet - bizAmt) / crew); }
  const clockHrs = ph / crew;
  const perHr = clockHrs > 0 ? each / clockHrs : 0;
  const belowFloor = priced.length > 0 && (crew === 1 ? splitNet < c.soloMin * days - 0.005 : each < c.dayMin * days - 0.005);
  const tax = !q.taxOn ? 0 : agreed ? r2(agreedIn - pre) : r2(pre * c.taxRate / 100);
  return { lines, itemsTotal, pass, ph, crew, minAdj, sub, chosen, pct, disc, limited, split, splitNet, bizAmt, each, clockHrs, perHr, belowFloor, days, tax, total: agreed ? agreedIn : r2(pre + tax), standardTotal, negAdj, agreed };
}

  h += '<div class="row"><button type="button" class="btn ghost" data-copy="open">Copy ' + (q.status === "done" ? "invoice" : "quote") + ' text</button><button type="button" class="btn ghost" data-print="open">Print ' + (q.status === "done" ? "invoice" : "quote") + '</button><button type="button" class="btn ghost" data-edit="1">Edit in Quote tab</button><button type="button" class="btn ghost" data-close="1">Close</button></div>';
  if (S.copyText) h += '<textarea id="copybox" class="copybox" readonly>' + esc(S.copyText) + "</textarea>";
  return h + "</section>";
}
function renderRates() {
  let h = '<div class="wrap" style="padding:0"><section class="card"><h2>Connection</h2>' +
    '<p class="small" style="margin:0">Quotes, jobs and rates save to your Google Sheet. Paste the web app URL from Apps Script and your PIN. Setup steps are in the repo README.</p>' +
    '<label class="f">Web app URL<input id="api-url" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(API.url) + '"></label>' +
    '<label class="f">PIN<input id="api-pin" type="password" autocomplete="current-password" value="' + esc(API.pin) + '"></label>' +
    '<div class="row"><button type="button" class="btn accent" data-connect="1">Connect and sync</button></div>' +
    '<p class="small" style="margin:0">' + esc(syncLine()) + "</p></section>";
  h += '<section class="card"><h2>Standard rates</h2>';
  h += '<p class="small" style="margin:0">Every quote uses these numbers, so the price depends on the job, not on who quotes it or who the customer is. Price = person-hours × target pay, grossed up so the business keeps its share, plus dump and crane fees.' +
    (S.isOwner ? "" : " Only Drew can change them.") + "</p>";
  if (!S.cfgSet) h += '<div class="note warn"><b>Check these numbers.</b> The 25% split, $150 solo minimum, $250 crew minimum and $300 goal are yours. Target pay per hour is my estimate: $300 over an 8-hour day.</div>';
  h += '<div class="grid2 stack">' + RATE_FIELDS.map(([k, label, hint]) =>
    '<label class="f">' + esc(label) + '<input id="cfg-' + k + '" type="number" inputmode="decimal" step="any" data-cfg="' + k + '" value="' + esc(S.cfg[k]) + '"' + (S.isOwner || S.mode === "local" ? "" : " disabled") + ">" + (hint ? '<span class="small">' + esc(hint) + "</span>" : "") + "</label>").join("") + "</div>";
  const canSet = S.isOwner || S.mode === "local";
  h += '<div class="field"><div class="lbl">Discounts come out of</div><div class="chips">' +
    [["0", "Everyone's share"], ["1", "Business share only"]].map(([v, l]) => '<button type="button" class="chip" aria-pressed="' + (String(+S.cfg.discountFrom) === v) + '" data-dfrom="' + v + '"' + (canSet ? "" : " disabled") + ">" + l + "</button>").join("") + "</div></div>";
  if (S.isOwner || S.mode === "local") h += '<div class="row"><button type="button" class="btn accent" data-savecfg="1">Save rates</button><button type="button" class="btn ghost" data-resetcfg="1">Reset to placeholders</button></div>' +
    (S.mode === "local" ? '<p class="small" style="margin:0">The shared log isn\'t connected here, so these rates are saved on this phone only.</p>' : "");
  h += '</section><section class="card"><h2>Where the guardrails come from</h2>' +
    '<p class="small" style="margin:0"><b>Public floor:</b> lowest real per-tree bids on a TxDOT maintenance contract (Jasper County, bid Nov 13, 2024), by trunk size. Highway work in volume, so it marks the bottom of the market, not a residential price.</p>' +
    '<p class="small" style="margin:0"><b>Crew wages (BLS, May 2025, Houston metro):</b> tree trimmers average $20.08/hr, with the middle half earning $18.63–$21.71. Landscaping crew supervisors average $24.47/hr. <a href="' + BLS_URL + '" target="_blank" rel="noopener">BLS Houston metro table</a>.</p>' +
    "</section></div>";
  $("#view").innerHTML = h;
  $("#bar").innerHTML = "";
}
function render() {
  document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === S.tab)));
  if (S.tab === "quote") renderQuote(); else if (S.tab === "log") renderLog(); else renderRates();
}
function syncLine() {
  const n = outbox().length;
  if (S.mode === "online") return "Synced with your sheet" + (S.lastSync ? " at " + new Date(S.lastSync).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "") + ".";
  if (S.mode === "offline") return "Offline. " + n + " change" + (n === 1 ? "" : "s") + " waiting to sync.";
  if (S.mode === "error") return "Sheet problem: " + S.syncError;
  if (S.mode === "setup") return "Not connected to your sheet. Saving on this phone.";
  return "Connecting to your sheet…";
}
function setMode() {
  const el = $("#mode");
  el.innerHTML = '<span class="dot' + (S.mode === "online" ? " on" : "") + '"></span><span>' + esc(syncLine()) + "</span>";
}

/* ---------- quote text for texting/emailing ---------- */
function quoteText(customer, num, t, dateMs, taxRate, isInvoice) {
  const L = [];
  L.push("South East Stump Jumpers LLC");
  L.push((isInvoice ? "Invoice " : "Quote ") + (num || "(number assigned when saved)") + " · " + new Date(dateMs || Date.now()).toLocaleDateString() + (isInvoice ? "" : " · valid 30 days"));
  if (customer?.name) L.push("For: " + customer.name + (customer.address ? ", " + customer.address : "") + (customer.city ? ", " + customer.city : ""));
  L.push("");
  t.lines.filter((l) => !l.r.blocked).forEach((l, i) => L.push((i + 1) + ". " + l.r.desc + " " + money(l.r.price)));
  if (t.trip) L.push("Trip & setup: " + money(t.trip));
  if (t.minAdj) L.push("Day-minimum adjustment: " + money(t.minAdj));
  if (t.disc) L.push(t.chosen.map((d) => d.label).join(", ") + " discount: " + money(-t.disc));
  if (t.negAdj) L.push("Agreed price adjustment: " + money(t.negAdj));
  if (t.tax) L.push("Sales tax (" + (taxRate ?? S.cfg.taxRate) + "%): " + money(t.tax));
  L.push("TOTAL: " + money(t.total));
  L.push("");
  L.push(isInvoice ? "Payment due upon completion. Questions: 281-642-4685 · Dex@SeStumpJumpers.com" : "To accept or ask a question: 281-642-4685 · Dex@SeStumpJumpers.com");
  if (!isInvoice) L.push("Payment due on completion.");
  return L.join("\n");
}
async function copy(text) {
  S.copyText = text; render();
  try { await navigator.clipboard.writeText(text); toast("Quote copied. Paste it into a text or email."); }
  catch (e) { const b = $("#copybox"); if (b) { b.focus(); b.select(); } toast("Select the text below and copy it."); }
}

/* ---------- backend: Google Sheet via Apps Script ---------- */
const API = { get url() { return store("sesj.api") || ""; }, get pin() { return store("sesj.pin") || ""; } };
const LOGO = document.querySelector("header.top img").src;
let syncing = false;
function err(code, message) { const e = new Error(message); e.code = code; return e; }
async function call(action, payload) {
  if (!API.url || !API.pin) throw err("not_connected", "Not connected to your sheet yet.");
  let res, data;
  try {
    res = await fetch(API.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ action: action, pin: API.pin }, payload || {})) });
  } catch (e) { throw err("offline", "Can't reach your sheet right now."); }
  try { data = await res.json(); } catch (e) { throw err("bad_response", "The web app URL didn't answer like the quote backend. Check the URL and that it's deployed for Anyone."); }
  if (!data.ok) throw err(data.error || "server", data.message || "The sheet refused the request.");
  return data;
}
function outbox() { return store("sesj.outbox") || []; }
function setOutbox(list) { store("sesj.outbox", list); }
function cacheQuotes() { store("sesj.cache", S.quotes); }
function upsertLocal(rec) {
  const i = S.quotes.findIndex((x) => x.id === rec.id);
  if (i >= 0) S.quotes[i] = rec; else S.quotes.unshift(rec);
  S.quotes.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  cacheQuotes();
}
function mergeServer(serverQuotes) {
  const byId = new Map(serverQuotes.map((q) => [q.id, q]));
  outbox().forEach((q) => { const s = byId.get(q.id); byId.set(q.id, s ? Object.assign({}, q, { jobNo: s.jobNo }) : q); });
  S.quotes = [...byId.values()].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  cacheQuotes();
}
function failMode(e) {
  S.syncError = e.message || "";
  S.mode = e.code === "not_connected" ? "setup" : e.code === "offline" ? "offline" : "error";
}
async function flush() {
  if (syncing) return;
  syncing = true;
  try {
    let list = outbox();
    while (list.length) {
      const q = list[0];
      const d = await call("saveQuote", { quote: q });
      const saved = d.quote;
      const latest = outbox().find((x) => x.id === saved.id);
      if (latest && (latest.updatedAt || 0) > (q.updatedAt || 0)) latest.jobNo = saved.jobNo;
      upsertLocal(latest && latest !== q && (latest.updatedAt || 0) > (q.updatedAt || 0) ? latest : saved);
      if (S.draft.id === saved.id && saved.jobNo) { S.draft.num = saved.jobNo; saveDraft(); }
      list = outbox().filter((x) => !(x.id === saved.id && (x.updatedAt || 0) <= (q.updatedAt || 0)));
      list = list.map((x) => (x.id === saved.id ? Object.assign(x, { jobNo: saved.jobNo }) : x));
      setOutbox(list);
    }
  } finally { syncing = false; }
}
function typing() { const a = document.activeElement; return a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA"); }
async function refresh() {
  if (!API.url || !API.pin) { S.mode = "setup"; setMode(); return; }
  const before = JSON.stringify([S.cfg, S.quotes]);
  try {
    await flush();
    const d = await call("bootstrap");
    if (d.rates && Object.keys(d.rates).length) { S.cfg = { ...DEFAULTS, ...d.rates }; S.cfgSet = true; store("sesj.cfg", S.cfg); }
    mergeServer(d.quotes || []);
    S.mode = outbox().length ? "offline" : "online";
    S.lastSync = Date.now();
  } catch (e) { failMode(e); }
  setMode();
  if (JSON.stringify([S.cfg, S.quotes]) !== before && !typing()) render();
}
async function writeQuote(rec) {
  upsertLocal(rec);
  setOutbox(outbox().filter((x) => x.id !== rec.id).concat([rec]));
  try { await flush(); S.mode = "online"; S.lastSync = Date.now(); } catch (e) { failMode(e); }
  setMode();
}

/* ---------- saving ---------- */
function snapshotOf(t) {
  return { lines: t.lines.map((l) => ({ it: l.it, r: l.r })), minAdj: t.minAdj, chosen: t.chosen, disc: t.disc, negAdj: t.negAdj,
           agreed: t.agreed, standard: t.standardTotal, tax: t.tax, total: t.total, crew: t.crew, pass: t.pass,
           bizAmt: t.bizAmt, each: t.each, splitNet: t.splitNet };
}
async function saveQuote() {
  const q = S.draft, t = priceQuote(q, S.cfg), now = Date.now();
  const existing = q.id ? S.quotes.find((x) => x.id === q.id) : null;
  const rec = {
    id: q.id || ("q" + now.toString(36) + Math.random().toString(36).slice(2, 6)),
    jobNo: existing?.jobNo || q.num || "", createdAt: existing?.createdAt || now, updatedAt: now,
    customer: { ...q.customer }, notes: q.notes, items: q.items, discounts: q.discounts, taxOn: q.taxOn, override: q.override,
    agreed: q.agreed || "", crew: t.crew, snapshot: snapshotOf(t), total: t.total, pass: t.pass, payEach: t.each, payBiz: t.bizAmt,
    rates: { ...S.cfg }, status: existing?.status || "quoted", competitor: existing?.competitor ?? null,
    lostReason: existing?.lostReason ?? "", checklist: existing?.checklist || {}, jobNotes: existing?.jobNotes ?? "", doneAt: existing?.doneAt ?? null
  };
  q.id = rec.id; saveDraft();
  await writeQuote(rec);
  const saved = S.quotes.find((x) => x.id === rec.id);
  if (saved?.jobNo) { q.num = saved.jobNo; saveDraft(); }
  toast(saved?.jobNo ? (existing ? "Updated " : "Saved as ") + saved.jobNo + "." : "Saved on this phone. It gets a job number when it syncs.");
  render();
}
async function patchOpen(patch) {
  const q = S.quotes.find((x) => x.id === S.openId); if (!q) return;
  const rec = JSON.parse(JSON.stringify(q));
  Object.assign(rec, patch, { updatedAt: Date.now() });
  await writeQuote(rec);
  render();
}

/* ---------- printable quote / invoice ---------- */
function docRows(t, taxRate) {
  const rows = t.lines.filter((l) => !l.r.blocked).map((l) => [l.r.desc, l.r.price, ""]);
  if (t.trip) rows.push(["Trip & setup", t.trip, ""]);
  if (t.minAdj) rows.push(["Day-minimum adjustment", t.minAdj, ""]);
  if (t.disc) rows.push([t.chosen.map((d) => d.label).join(", ") + " discount", -t.disc, ""]);
  if (t.negAdj) rows.push(["Agreed price adjustment", t.negAdj, ""]);
  if (t.tax) rows.push(["Sales tax (" + (taxRate ?? S.cfg.taxRate) + "%)", t.tax, ""]);
  rows.push(["Total", t.total, "tot"]);
  return rows;
}
function printDoc(customer, jobNo, t, dateMs, taxRate, isInvoice) {
  const c = customer || {};
  const when = new Date(dateMs || Date.now()).toLocaleDateString();
  $("#print").innerHTML =
    '<div class="ph"><img src="' + LOGO + '" alt="South East Stump Jumpers logo"><div><h1>South East Stump Jumpers LLC</h1>' +
    "<div>281-642-4685 · Dex@SeStumpJumpers.com</div><div>Houston, Texas</div></div>" +
    '<div class="doc"><div class="t">' + (isInvoice ? "Invoice" : "Quote") + "</div><div>" + esc(jobNo || "") + "</div><div>" + esc(when) + "</div></div></div>" +
    '<div class="bill"><b>' + (isInvoice ? "Bill to" : "Prepared for") + "</b><br>" + esc(c.name || "") + "<br>" + esc(c.address || "") + (c.city ? "<br>" + esc(c.city) : "") + (c.phone ? "<br>" + esc(c.phone) : "") + "</div>" +
    "<table><thead><tr><th>Description</th><th class=\"r\">Amount</th></tr></thead><tbody>" +
    docRows(t, taxRate).map(([d, a, cls]) => '<tr class="' + cls + '"><td>' + esc(d) + '</td><td class="r">' + money(a) + "</td></tr>").join("") + "</tbody></table>" +
    '<div class="foot">' + (isInvoice ? "Payment due upon completion. Checks payable to South East Stump Jumpers LLC. Thank you for your business."
      : "This quote is valid for 30 days. Payment due upon completion. To accept, call or text 281-642-4685.") + "</div>";
  window.print();
}

/* ---------- events ---------- */
function setPath(obj, path, val) { const ks = path.split("."); let o = obj; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = val; }
function getPath(obj, path) { return path.split(".").reduce((o, k) => o?.[k], obj); }
document.addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.tab) { S.tab = d.tab; S.copyText = ""; render(); window.scrollTo(0, 0); return; }
  if (d.set) {
    const parts = d.set.split(".");
    if (parts[2] === "kind") { const i = +parts[1]; const old = S.draft.items[i]; S.draft.items[i] = { ...newItem(d.val), species: old.species }; }
    else { const cur = getPath(S.draft, d.set); setPath(S.draft, d.set, (d.set.endsWith("species") && cur === d.val) ? "" : d.val); }
    S.copyText = ""; saveDraft(); render(); return;
  }
  if (d.toggle) { setPath(S.draft, d.toggle, !getPath(S.draft, d.toggle)); S.copyText = ""; saveDraft(); render(); return; }
  if (d.add) { S.draft.items.push(newItem("removal")); saveDraft(); render(); return; }
  if (d.remove) { S.draft.items.splice(+d.remove, 1); saveDraft(); render(); return; }
  if (d.disc) { const ds = S.draft.discounts; const i = ds.indexOf(d.disc); if (i >= 0) ds.splice(i, 1); else ds.push(d.disc); S.copyText = ""; saveDraft(); render(); return; }
  if (d.clearagreed) { S.draft.agreed = ""; saveDraft(); render(); return; }
  if (d.save) { b.disabled = true; await saveQuote(); return; }
  if (d.new) { S.draft = blankDraft(); S.copyText = ""; saveDraft(); render(); window.scrollTo(0, 0); toast("New quote started."); return; }
  if (d.copy === "draft") { const t = priceQuote(S.draft, S.cfg); copy(quoteText(S.draft.customer, S.draft.num, t, null, null, false)); return; }
  if (d.copy === "open") { const q = S.quotes.find((x) => x.id === S.openId); if (q) copy(quoteText(q.customer, q.jobNo, q.snapshot, q.createdAt, q.rates?.taxRate, q.status === "done")); return; }
  if (d.print === "draft") { printDoc(S.draft.customer, S.draft.num, priceQuote(S.draft, S.cfg), null, null, false); return; }
  if (d.print === "open") { const q = S.quotes.find((x) => x.id === S.openId); if (q) printDoc(q.customer, q.jobNo, q.snapshot, q.status === "done" ? q.doneAt : q.createdAt, q.rates?.taxRate, q.status === "done"); return; }
  if (d.open) { S.openId = d.open; S.copyText = ""; render(); window.scrollTo(0, 0); return; }
  if (d.close) { S.openId = null; S.copyText = ""; render(); return; }
  if (d.status) { await patchOpen({ status: d.status }); return; }
  if (d.complete) { await patchOpen({ status: "done", doneAt: Date.now() }); toast("Job complete. Print or copy the invoice."); return; }
  if (d.edit) {
    const q = S.quotes.find((x) => x.id === S.openId); if (!q) return;
    S.draft = { id: q.id, num: q.jobNo || "", customer: { ...q.customer }, notes: q.notes || "", items: JSON.parse(JSON.stringify(q.items)),
                discounts: [...(q.discounts || [])], taxOn: q.taxOn !== false, override: !!q.override, crew: q.crew || 2, agreed: q.agreed || "" };
    saveDraft(); S.tab = "quote"; S.copyText = ""; render(); window.scrollTo(0, 0); return;
  }
  if (d.connect) {
    store("sesj.api", ($("#api-url").value || "").trim());
    store("sesj.pin", ($("#api-pin").value || "").trim());
    S.mode = "starting"; setMode(); b.disabled = true;
    await refresh();
    render();
    toast(S.mode === "online" ? "Connected to your Google Sheet." : (S.syncError || "Couldn't connect."));
    return;
  }
  if (d.savecfg) {
    const next = { ...S.cfg };
    document.querySelectorAll("[data-cfg]").forEach((inp) => { next[inp.dataset.cfg] = num(inp.value, DEFAULTS[inp.dataset.cfg]); });
    S.cfg = next; S.cfgSet = true; store("sesj.cfg", next);
    try {
      const r = await call("saveRates", { rates: next, labels: Object.fromEntries(RATE_FIELDS.map(([k, l]) => [k, l])) });
      if (r.rates) S.cfg = { ...DEFAULTS, ...r.rates };
      toast("Rates saved to your Google Sheet.");
    } catch (er) { toast(er.code === "not_connected" ? "Rates saved on this phone. Connect your sheet to keep them there." : "Couldn't reach the sheet. Rates saved on this phone."); }
    render(); return;
  }
  if (d.dfrom) { S.cfg = { ...S.cfg, discountFrom: +d.dfrom }; render(); toast("Tap Save rates to keep this."); return; }
  if (d.resetcfg) { S.cfg = { ...DEFAULTS }; render(); toast("Placeholders loaded. Tap Save rates to keep them."); return; }
});
let inputTimer = null;
document.addEventListener("input", (e) => {
  const el = e.target;
  if (!el.dataset.input) return;
  setPath(S.draft, el.dataset.input, el.value);
  saveDraft();
  clearTimeout(inputTimer);
  if (/items\.\d+\.(stumpIn|hours|loads|price|desc|linesPlan)|^agreed$/.test(el.dataset.input)) {
    inputTimer = setTimeout(() => { const id = el.id, pos = el.selectionStart; render(); const n = document.getElementById(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} } }, 600);
  }
});
document.addEventListener("change", async (e) => {
  const el = e.target;
  if (el.dataset.check) { S.draft[el.dataset.check] = el.checked; saveDraft(); render(); return; }
  if (el.dataset.qcheck) { const q = S.quotes.find((x) => x.id === S.openId); if (!q) return; await patchOpen({ checklist: { ...(q.checklist || {}), [el.dataset.qcheck]: el.checked } }); return; }
  if (el.dataset.qfield) { const v = el.dataset.qfield === "competitor" ? (el.value === "" ? null : num(el.value)) : el.value; await patchOpen({ [el.dataset.qfield]: v }); return; }
});

/* ---------- start ---------- */
S.quotes = store("sesj.cache") || [];
outbox().forEach((q) => { if (!S.quotes.some((x) => x.id === q.id)) S.quotes.unshift(q); });
S.mode = API.url && API.pin ? "starting" : "setup";
setMode(); render();
refresh();
setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 60000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
window.addEventListener("online", () => refresh());
})();
</script>
